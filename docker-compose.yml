version: '3.9'

services:
  backend:
    image: baboonmd-backend:dev
    build:
      context: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: baboonmd-frontend:dev
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
