name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: tests

      - name: Install Snapshot Tools
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: "graphicsmagick ghostscript"
          version: 1





      # ---------- Docker layer caching setup ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build app services (with cache)
        run: |
          docker buildx bake \
            --allow=fs=/tmp \
            -f ../docker-compose.prod.yml \
            --progress plain \
            --set *.cache-from=type=local,src=/tmp/.buildx-cache \
            --set *.cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max
        working-directory: tests

      - name: Move updated cache
        run: mv /tmp/.buildx-cache-new /tmp/.buildx-cache




