services:
  backend:
    image: baboonmd-backend:prod
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - FRONTEND_CORS_URL=http://localhost:5173
      - FRONTEND_EDITOR_URL=http://frontend:5173/editor

  frontend:
    image: baboonmd-frontend:prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped